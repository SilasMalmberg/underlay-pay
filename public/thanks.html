<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNDERLAY</title>
    <link rel="icon" href="/underlay-mark.png" type="image/png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0b0c;
        color: #f2f1ee;
        padding: 40px 20px;
      }
      main { width: 100%; max-width: 22rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      .kicker {
        margin: 20px 0 0;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #8c8c93;
      }
      h1 { font-family: ui-serif, Georgia, serif; font-size: 2.4rem; font-weight: 500; margin: 8px 0 0; }
      p { color: #8c8c93; }
      .box {
        display: block;
        width: 100%;
        margin: 16px 0 8px;
        padding: 12px 14px;
        border: 0;
        border-radius: 16px;
        background: #141416;
        color: #f2f1ee;
        font: 11px/1.5 ui-monospace, monospace;
        text-align: left;
        word-break: break-all;
        cursor: pointer;
      }
      a.btn {
        display: flex;
        height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #f2f1ee;
        color: #0b0b0c;
        text-decoration: none;
        font-weight: 500;
      }
      .faint { font-size: 12px; color: #63636b; }
    </style>
  </head>
  <body>
    <main>
      <img src="/underlay-mark.png" alt="UNDERLAY" width="72" height="72" />
      <p class="kicker">Underlay</p>
      <h1 id="title">Thank you</h1>
      <div id="body"></div>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      const sid = q.get("session_id") || q.get("sid") || "";
      const title = document.getElementById("title");
      const body = document.getElementById("body");
      const names = { underlay: "UNDERLAY", pro: "UNDERLAY Pro", max: "UNDERLAY Max" };
      const stripeUrl = location.origin + "/thanks?session_id={CHECKOUT_SESSION_ID}";

      function html(s) { body.innerHTML = s; }

      if (!sid) {
        title.textContent = "After payment";
        html(
          "<p>Put this on all three Stripe Payment Links as the success URL.</p>" +
          "<button class='box' id='copy'>" + stripeUrl + "</button>" +
          "<p class='faint' id='hint'>Tap to copy</p>" +
          "<p>Add STRIPE_SECRET_KEY in Vercel → Settings → Environment Variables, then Redeploy.</p>"
        );
        document.getElementById("copy").onclick = async () => {
          try {
            await navigator.clipboard.writeText(stripeUrl);
            document.getElementById("hint").textContent = "Copied";
          } catch (_) {}
        };
      } else {
        title.textContent = "One moment";
        html("<p>Checking your payment with Stripe.</p>");
        fetch("/api/stripe/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sid }),
        })
          .then((r) => r.json().catch(() => ({})))
          .then((data) => {
            if (data && data.ok && data.token) {
              title.textContent = "Thank you";
              const href =
                "https://chatgpt.com/?underlay=unlock&token=" + encodeURIComponent(data.token);
              html(
                "<p>" + (names[data.plan] || "UNDERLAY") + " is ready. Open ChatGPT with the extension on.</p>" +
                "<p><a class='btn' href='" + href + "'>Open ChatGPT</a></p>" +
                "<p class='faint'>Cancel in the Stripe portal from your receipt.</p>"
              );
              return;
            }
            title.textContent = "Not confirmed";
            html(
              "<p>" +
                (data && data.error === "noconfig"
                  ? "Add STRIPE_SECRET_KEY on Vercel, then Redeploy."
                  : "Stripe did not confirm this checkout. If you were charged, write Malmbergsb@gmail.com.") +
              "</p>"
            );
          })
          .catch(() => {
            title.textContent = "Not confirmed";
            html("<p>Could not reach the server. Try again.</p>");
          });
      }
    </script>
  </body>
</html>
