<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNDERLAY</title>
    <meta name="description" content="Underlay lets you restyle the sites you already use. This page will soon be the homepage." />
    <link rel="icon" href="/underlay-mark.png" type="image/png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0b0c;
        color: #f2f1ee;
        padding: 40px 20px;
      }
      main { width: 100%; max-width: 26rem; text-align: center; }
      img { width: 84px; height: 84px; border-radius: 20px; }
      .kicker {
        margin: 22px 0 0;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #8c8c93;
      }
      h1 {
        font-family: ui-serif, Georgia, serif;
        font-size: 2.6rem;
        font-weight: 500;
        letter-spacing: -0.03em;
        margin: 8px 0 0;
      }
      p { margin: 14px 0 0; color: #8c8c93; }
      a.btn {
        display: flex;
        height: 48px;
        margin-top: 28px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #f2f1ee;
        color: #0b0b0c;
        font-weight: 600;
        text-decoration: none;
      }
      a.btn:hover { background: #fff; }
      .links { margin-top: 18px; font-size: 13px; }
      .links a { color: #8c8c93; }
    </style>
  </head>
  <body>
    <main>
      <img src="/underlay-mark.png" alt="Underlay" width="84" height="84" />
      <p class="kicker">Underlay</p>
      <h1>Make it yours.</h1>
      <p>This address will soon be the Underlay homepage. The site you know is still on the next page.</p>
      <a class="btn" href="https://underlay.framer.website">Continue to Underlay</a>
      <p class="links"><a href="/privacy">Privacy</a></p>
    </main>
  </body>
</html>
