<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Underlay guide</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    p { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.72); }
    .stage { width: min(1100px, calc(100vw - 48px)); aspect-ratio: 16 / 9; background: #000; }
    iframe { width: 100%; height: 100%; border: 0; background: #000; }
  </style>
</head>
<body>
  <p>How to use Underlay</p>
  <div class="stage">
    <iframe
      src="https://www.youtube.com/embed/e8NrmsJGZP0?autoplay=1&rel=0&modestbranding=1&playsinline=1"
      title="How to guide"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </div>
</body>
</html>
