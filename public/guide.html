<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How to guide</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 28px; }
    main { width: min(1100px, 100%); display: flex; flex-direction: column; gap: 18px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
    p { margin: 0; max-width: 640px; color: rgba(255,255,255,0.72); font-size: 15px; line-height: 1.45; }
    .stage {
      position: relative;
      width: min(100%, calc((100vh - 180px) * 16 / 9));
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      overflow: hidden;
      background: #111;
    }
    #player, iframe { width: 100%; height: 100%; border: 0; background: #000; }
    button {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    button:hover { background: rgba(0, 0, 0, 0.8); }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>How to guide</h1>
      <p>Turn Underlay on, pick a look, and change the background, colors and font. Alt + U turns it off.</p>
    </div>
    <div class="stage">
      <button type="button" id="x" aria-label="Close">×</button>
      <div id="player"></div>
    </div>
  </main>
  <script>
    document.getElementById("x").addEventListener("click", function () {
      window.close();
      document.dispatchEvent(new Event("underlay-close-guide"));
    });
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);
    var player;
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        videoId: "e8NrmsJGZP0",
        playerVars: {
          autoplay: 1,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          origin: "https://underlay-app.online"
        },
        events: {
          onReady: function (e) {
            e.target.playVideo();
          }
        }
      });
    };
  </script>
</body>
</html>
